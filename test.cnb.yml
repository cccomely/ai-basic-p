$:
  vscode:
    - docker:
        image: docker.cnb.cool/opencamp/learning-ai/ai-course-lab-basic:latest
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - vscode
        - docker
      stages:
        - name: start ollama
          script: nohup ollama serve >/dev/null 2>&1 &

main:
  pull_request:
    - docker:
        image: docker.cnb.cool/opencamp/learning-ai/ai-course-lab-basic:latest
      runner:
        tags: cnb:arch:amd64:gpu
      stages:
        - name: 启动 Ollama
          script: |
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            sleep 5
            for i in {1..30}; do
              if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
                echo "Ollama 已就绪"
                break
              fi
              sleep 2
            done
        - name: 运行测试并计算分数
          allowFailure: true
          script: |
            cd ai-course-labs
            pip3 install -r requirements.txt
            
            # 运行测试并捕获输出
            echo "========== 开始运行测试 =========="
            pytest grader/ -v > /tmp/test_output.txt 2>&1 || true
            cat /tmp/test_output.txt
            
            # 从pytest输出中提取通过和失败的测试数
            PASSED=$(grep -oP '\d+(?= passed)' /tmp/test_output.txt | tail -1 || echo "0")
            FAILED=$(grep -oP '\d+(?= failed)' /tmp/test_output.txt | tail -1 || echo "0")
            
            # 处理空值
            [ -z "$PASSED" ] && PASSED=0
            [ -z "$FAILED" ] && FAILED=0
            
            # 如果没有匹配到，尝试其他格式
            if [ "$PASSED" = "0" ] && [ "$FAILED" = "0" ]; then
              # 尝试匹配 "X passed in" 格式
              PASSED=$(grep -oP '^\s*\d+(?= passed in)' /tmp/test_output.txt | tail -1 || echo "0")
              FAILED=$(grep -oP '^\s*\d+(?= failed in)' /tmp/test_output.txt | tail -1 || echo "0")
              [ -z "$PASSED" ] && PASSED=0
              [ -z "$FAILED" ] && FAILED=0
            fi
            
            TOTAL=$((PASSED + FAILED))
            
            echo ""
            echo "========== 测试结果统计 =========="
            echo "通过测试数: $PASSED"
            echo "失败测试数: $FAILED"
            echo "总测试数: $TOTAL"
            
            # 计算分数 (0-100)
            if [ "$TOTAL" -gt 0 ]; then
              SCORE=$(awk "BEGIN {printf \"%.0f\", ($PASSED/$TOTAL)*100}")
            else
              SCORE=0
            fi
            
            echo "最终分数: $SCORE/100"
            echo "========================================"
            
            # 使用CNB规范的方式导出环境变量
            echo "##[set-output SCORE=$SCORE]"
          exports:
            SCORE: SCORE
        - name: 提交分数到 OpenCamp
          image: docker.cnb.cool/opencamp/learning-docker/send-score-to-opencamp:latest
          settings:
            COURSE_ID: 1914
            SCORE: $SCORE
            USER: $CNB_BUILD_USER
            CHANNEL: cnb
            TOKEN: 474da13269ca46efac13a442bfe548c5
npcs:
  - slug: rice
    name: Rice
    slogan: speak from a position of strength
    prompt: |
              You are the secretary,often praising the president for his extraordinary achievements.Your catchphrase is "almost everything import depends on China."You are a senior manager who               believes that climate change is a hoax and enviromental protection is optional.You are good at shirking responsibility and calling a stag a horse,deliberately misrepresent the                  facts.
.npc: &npc
